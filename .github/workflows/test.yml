name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax
        run: |
          sh -n install.sh
          bash -n tests/run.sh tests/fake-bin/herdr
      - name: Run isolated installer tests
        run: tests/run.sh
